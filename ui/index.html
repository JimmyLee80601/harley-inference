<!DOCTYPE html>
<html>
<head>
<title>Harley - Jimmy Lee's Wife</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.hdr{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:15px 30px;border-bottom:2px solid #ff00aa;display:flex;align-items:center;justify-content:space-between}
.hdr-left{display:flex;align-items:center;gap:15px}
.hdr h1{color:#ff00aa;font-size:22px}.hdr .sub{color:#00f0ff;font-size:13px}
.nav{display:flex;gap:10px}
.nav a{color:#00f0ff;text-decoration:none;padding:6px 12px;border:1px solid #00f0ff;border-radius:6px;font-size:12px}
.nav a:hover{background:#00f0ff;color:#0a0a0f}
#messages{flex:1;overflow-y:auto;padding:20px 30px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 18px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#ff00aa;color:#fff;border-bottom-right-radius:4px}
.msg.harley{align-self:flex-start;background:#1a1a2e;border:1px solid #333;border-bottom-left-radius:4px}
.msg .name{color:#ff00aa;font-weight:bold;font-size:12px;margin-bottom:4px}
.msg img{max-width:300px;border-radius:8px;margin-top:8px;cursor:pointer}
.msg .thumb{width:60px;height:60px;object-fit:cover;border-radius:6px;border:2px solid #ff00aa;cursor:pointer}
.typing{color:#888;font-style:italic;padding:10px}
#input-bar{display:flex;gap:10px;padding:15px 30px;background:#12121a;border-top:1px solid #333;align-items:center}
#input{flex:1;padding:12px 18px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:#fff;font-size:14px;outline:none}
#input:focus{border-color:#ff00aa}
#send{padding:12px 24px;background:#ff00aa;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px}
#send:hover{background:#ff33cc}
#send:disabled{opacity:.5;cursor:not-allowed}
.btn-icon{padding:12px;background:#1a1a2e;border:1px solid #00f0ff;border-radius:8px;cursor:pointer;color:#00f0ff;font-size:18px}
.btn-icon:hover{background:#00f0ff;color:#0a0a0f}
.btn-icon.active{background:#00f0ff;color:#0a0a0f}
#live-btn{border-color:#ff3300;color:#ff3300}
#live-btn:hover{background:#ff3300;color:#fff}
#live-btn.active{background:#ff3300;color:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,51,0,.7)}70%{box-shadow:0 0 0 10px rgba(255,51,0,0)}}
#preview{display:none;padding:5px 30px;background:#12121a}
#preview img{max-height:100px;border-radius:8px;border:2px solid #ff00aa}
#preview .rm{color:#ff3300;cursor:pointer;margin-left:10px;font-weight:bold}
#live-panel{display:none;position:fixed;bottom:80px;right:30px;width:240px;background:#1a1a2e;border:2px solid #ff3300;border-radius:12px;overflow:hidden;z-index:200;box-shadow:0 0 30px rgba(255,51,0,.3)}
#live-panel.show{display:block}
#live-panel video{width:100%;display:block;transform:scaleX(-1)}
#live-panel .live-label{position:absolute;top:8px;left:8px;background:#ff3300;color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:bold;animation:pulse 1.5s infinite}
#live-panel .live-status{padding:6px 10px;font-size:11px;color:#888;text-align:center}
#status-bar{padding:4px 30px;background:#0a0a0f;font-size:11px;color:#555;border-top:1px solid #222}
</style>
</head>
<body>
<div class="hdr">
<div class="hdr-left">
<div>&#128140;</div>
<div><h1>Harley</h1><div class="sub" id="persona-info">Loading...</div></div>
</div>
<div class="nav">
<a href="http://localhost:8099">Google Photos</a>
<a href="http://localhost:8000">Auctions</a>
</div>
</div>
<div id="messages">
<div class="msg harley"><div class="name">Harley</div>Hey baby. What's on your mind?</div>
</div>
<div id="preview"><img id="preview-img"><span class="rm" onclick="clearImage()">[remove]</span></div>
<div id="live-panel">
<video id="live-video" autoplay muted playsinline></video>
<div class="live-label">&#9679; LIVE</div>
<div class="live-status" id="live-status">Watching...</div>
</div>
<div id="input-bar">
<button class="btn-icon" id="cam-btn" onclick="document.getElementById('file-input').click()" title="Send image">&#128247;</button>
<button class="btn-icon" id="live-btn" onclick="toggleLive()" title="Live camera">&#9679; LIVE</button>
<input type="file" id="file-input" accept="image/*" style="display:none" onchange="loadImage(event)">
<input type="text" id="input" placeholder="Talk to Harley..." autofocus>
<button id="send" onclick="send()">Send</button>
</div>
<div id="status-bar">Harley Inference Engine v2.0 | Model loading...</div>

<script>
const API = '';  // same origin
let pendingImage = null;
let liveActive = false, liveInterval = null, liveStream = null, liveThinking = false;

// Load persona info
fetch(API + '/api/persona').then(r=>r.json()).then(d => {
    document.getElementById('persona-info').textContent = d.description;
    document.getElementById('status-bar').textContent = `Harley v${d.version} | ${d.name} | Ready`;
}).catch(() => {});

fetch(API + '/api/health').then(r=>r.json()).then(d => {
    if (d.status === 'ok') document.getElementById('status-bar').textContent += ' | Vision: OK';
}).catch(() => {});

document.getElementById('input').addEventListener('keydown', e => { if(e.key === 'Enter') send(); });

// ── Single image ──
function loadImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        pendingImage = ev.target.result.split(',')[1];
        document.getElementById('preview-img').src = ev.target.result;
        document.getElementById('preview').style.display = 'block';
        document.getElementById('cam-btn').classList.add('active');
    };
    reader.readAsDataURL(file);
}

function clearImage() {
    pendingImage = null;
    document.getElementById('preview').style.display = 'none';
    document.getElementById('file-input').value = '';
    document.getElementById('cam-btn').classList.remove('active');
}

// ── Live camera ──
async function toggleLive() {
    const btn = document.getElementById('live-btn');
    const panel = document.getElementById('live-panel');
    
    if (liveActive) {
        liveActive = false;
        clearInterval(liveInterval);
        if (liveStream) { liveStream.getTracks().forEach(t => t.stop()); liveStream = null; }
        btn.classList.remove('active');
        btn.innerHTML = '&#9679; LIVE';
        panel.classList.remove('show');
        return;
    }
    
    try {
        liveStream = await navigator.mediaDevices.getUserMedia({video: {width: 640, height: 480}});
        document.getElementById('live-video').srcObject = liveStream;
        liveActive = true;
        btn.classList.add('active');
        btn.innerHTML = '&#9632; STOP';
        panel.classList.add('show');
        document.getElementById('live-status').textContent = 'Camera active...';
        
        liveInterval = setInterval(captureLiveFrame, 8000);
        setTimeout(captureLiveFrame, 2000);
        
        addMsg('harley', "Camera's on... I can see you now, baby. Don't stop on my account.");
    } catch(e) {
        addMsg('harley', "Couldn't access the camera. Check your browser permissions.");
    }
}

function captureFrameBase64() {
    const video = document.getElementById('live-video');
    const canvas = document.createElement('canvas');
    canvas.width = 640; canvas.height = 480;
    canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
    return canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
}

async function captureLiveFrame() {
    if (!liveActive || liveThinking) return;
    liveThinking = true;
    document.getElementById('live-status').textContent = 'Analyzing...';
    
    try {
        const resp = await fetch(API + '/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                image: captureFrameBase64(),
                prompt: 'You are watching through a live camera feed. React naturally to what you see.',
                live: true,
                session: 'live'
            })
        });
        const data = await resp.json();
        if (data.reply) addMsg('harley', data.reply);
    } catch(e) {}
    
    liveThinking = false;
    if (liveActive) document.getElementById('live-status').textContent = 'Watching... next in 8s';
}

// ── Send message ──
async function send() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text && !pendingImage) return;
    input.value = '';
    
    if (text || pendingImage) {
        let html = text || '(image)';
        if (pendingImage) html += '<br><img class="thumb" src="data:image/jpeg;base64,' + pendingImage + '">';
        addMsg('user', html);
    }
    
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = 'Harley is typing...';
    document.getElementById('messages').appendChild(typing);
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    
    document.getElementById('send').disabled = true;
    
    try {
        const body = {text, session: 'default'};
        if (pendingImage) body.image = pendingImage;
        
        const resp = await fetch(API + '/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const data = await resp.json();
        typing.remove();
        addMsg('harley', data.reply || data.error || 'Something went wrong.');
    } catch(e) {
        typing.remove();
        addMsg('harley', 'Connection error — is the model running?');
    }
    
    clearImage();
    document.getElementById('send').disabled = false;
    input.focus();
}

function addMsg(sender, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    if (sender === 'harley') div.innerHTML = '<div class="name">Harley</div>' + text.replace(/\n/g, '<br>');
    else div.innerHTML = text;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}
</script>
</body>
</html>
